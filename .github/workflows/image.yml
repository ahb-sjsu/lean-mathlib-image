name: image

on:
  workflow_dispatch:
    inputs:
      lean:
        description: Lean release tag
        default: v4.33.1
      mathlib:
        description: Mathlib commit
        default: 0df444a360eaa60ab8c11dca51a86af692955474
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/image.yml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN: ${{ inputs.lean || 'v4.33.1' }}
      MATHLIB: ${{ inputs.mathlib || '0df444a360eaa60ab8c11dca51a86af692955474' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the image is about 8 GB uncompressed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - name: Tag
        run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/lean-mathlib:${LEAN}-mathlib-${MATHLIB:0:8}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          docker build --build-arg LEAN="$LEAN" --build-arg MATHLIB="$MATHLIB" -t "$IMAGE" .
          docker run --rm "$IMAGE" sh -c 'lean --version && cat /opt/lean/lake-manifest.json && du -sh /opt/lean/packages'
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          echo "pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
